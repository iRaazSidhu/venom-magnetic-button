<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#e9e6df" />
  <meta name="description" content="A Venom-inspired magnetic button experiment with animated tendrils." />
  <title>Venom Magnetic Button — Interactive Experiment</title>
  <style>
    :root { color-scheme: light; --paper:#e9e6df; --ink:#08090c; --muted:#77736c; --button-width:292px; --button-height:104px; --ease-out:cubic-bezier(.2,.8,.2,1); }
    * { box-sizing:border-box; }
    html,body { width:100%; min-height:100%; margin:0; }
    body { min-height:100svh; overflow:hidden; background:radial-gradient(ellipse at 50% 45%,rgba(255,255,255,.28),transparent 54%),var(--paper); color:var(--ink); font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; -webkit-font-smoothing:antialiased; }
    .stage { position:relative; display:grid; place-items:center; width:100%; min-height:100svh; isolation:isolate; overflow:hidden; }
    .stage::before { content:""; position:absolute; inset:-50%; z-index:-1; pointer-events:none; opacity:.18; background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.88' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.23'/%3E%3C/svg%3E"); transform:rotate(-4deg); }
    .topline { position:absolute; top:clamp(24px,5.5vh,52px); left:50%; width:max-content; max-width:calc(100vw - 32px); transform:translateX(-50%); text-align:center; pointer-events:none; }
    .eyebrow { margin:0 0 10px; color:#77746d; font:600 10px/1.2 ui-monospace,SFMono-Regular,Menlo,monospace; letter-spacing:.2em; text-transform:uppercase; }
    .instruction { margin:0; color:#5e5a54; font-size:12px; letter-spacing:.015em; }
    .button-wrap { position:absolute; left:50%; top:50%; z-index:2; width:var(--button-width); height:var(--button-height); transform:translate(-50%,-50%); pointer-events:none; }
    .venom-button { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; width:100%; height:100%; padding:0 27px; overflow:hidden; border:1px solid rgba(255,255,255,.17); border-radius:999px; background:linear-gradient(150deg,rgba(255,255,255,.15) 0%,transparent 26%),linear-gradient(180deg,#17181d 0%,#050609 52%,#101115 100%); box-shadow:0 20px 34px rgba(35,31,26,.18),0 5px 12px rgba(20,18,16,.16),inset 0 1px 1px rgba(255,255,255,.3),inset 0 -2px 4px rgba(0,0,0,.55); color:#f7f7f5; cursor:pointer; pointer-events:auto; transform:translate3d(var(--tx,0px),var(--ty,0px),0) rotate(var(--tilt,0deg)) scale(var(--scale,1)); transform-origin:50% 50%; transition:box-shadow 180ms ease,filter 180ms ease; will-change:transform; -webkit-tap-highlight-color:transparent; }
    .venom-button::before { content:""; position:absolute; top:-52%; left:14%; width:40%; height:100%; border-radius:50%; background:rgba(255,255,255,.12); filter:blur(18px); transform:rotate(-18deg); pointer-events:none; }
    .venom-button::after { content:""; position:absolute; inset:1px; border:1px solid rgba(255,255,255,.035); border-radius:inherit; pointer-events:none; }
    .button-label { position:relative; z-index:3; display:inline-block; color:inherit; font-size:clamp(19px,2.15vw,24px); font-weight:650; letter-spacing:-.055em; line-height:1; white-space:nowrap; text-shadow:0 1px 2px rgba(0,0,0,.24); transition:transform 220ms var(--ease-out),letter-spacing 220ms var(--ease-out); }
    .venom-button:focus-visible { outline:2px solid #2f333b; outline-offset:7px; }
    .venom-button:hover { box-shadow:0 24px 38px rgba(28,25,22,.23),0 5px 12px rgba(20,18,16,.16),inset 0 1px 1px rgba(255,255,255,.34); }
    .venom-button:hover .button-label { letter-spacing:-.045em; }
    .venom-button.is-caught { filter:contrast(1.08); }
    .venom-button.is-caught .button-label { transform:scale(.96); }
    .tendrils { position:absolute; inset:0; z-index:3; width:100%; height:100%; overflow:visible; pointer-events:none; }
    .tendril-glow { fill:none; stroke:#050609; stroke-linecap:round; stroke-linejoin:round; opacity:0; filter:blur(2px); transition:opacity 180ms ease; }
    .tendril { fill:none; stroke:#08090c; stroke-linecap:round; stroke-linejoin:round; opacity:0; transition:opacity 180ms ease; }
    .stage.is-active .tendril { opacity:var(--strand-opacity,.82); }
    .stage.is-active .tendril-glow { opacity:var(--glow-opacity,.18); }
    .stage.is-active .venom-button { box-shadow:0 26px 40px rgba(28,25,22,.25),0 5px 12px rgba(20,18,16,.18),inset 0 1px 1px rgba(255,255,255,.32); }
    .status { position:absolute; bottom:clamp(26px,5.5vh,50px); left:50%; display:inline-flex; align-items:center; gap:8px; transform:translateX(-50%); color:#77736d; font:500 10px/1.3 ui-monospace,SFMono-Regular,Menlo,monospace; letter-spacing:.12em; text-transform:uppercase; white-space:nowrap; pointer-events:none; }
    .status-dot { width:5px; height:5px; border-radius:50%; background:#a09b91; transition:background 180ms ease,box-shadow 180ms ease; }
    .stage.is-active .status-dot { background:#17191d; box-shadow:0 0 0 4px rgba(8,9,12,.09); }
    .signature { position:absolute; right:24px; bottom:20px; color:rgba(80,76,69,.62); font:500 9px/1.2 ui-monospace,SFMono-Regular,Menlo,monospace; letter-spacing:.06em; pointer-events:none; }
    @media (max-width:520px) { :root { --button-width:min(292px,calc(100vw - 56px)); --button-height:88px; } .topline { top:8vh; } .instruction { max-width:280px; margin-inline:auto; line-height:1.5; } .status { bottom:8vh; font-size:9px; letter-spacing:.08em; } .signature { right:14px; bottom:13px; } }
    @media (hover:none),(pointer:coarse) { .tendril,.tendril-glow { opacity:0!important; } .venom-button { transform:none!important; } }
    @media (prefers-reduced-motion:reduce) { *,*::before,*::after { scroll-behavior:auto!important; transition-duration:.01ms!important; animation-duration:.01ms!important; animation-iteration-count:1!important; } .tendril,.tendril-glow { opacity:0!important; } .venom-button { transform:none!important; } }
  </style>
</head>
<body>
  <main class="stage" id="stage" aria-label="Venom magnetic button interactive demo">
    <header class="topline"><p class="eyebrow">Interactive experiment / 001</p><p class="instruction">Move your cursor close. Let it get caught.</p></header>
    <div class="button-wrap" id="buttonWrap"><button class="venom-button" id="venomButton" type="button" aria-label="Let's collaborate — Venom magnetic button demo"><span class="button-label" id="buttonLabel">let’s collaborate</span></button></div>
    <svg class="tendrils" id="tendrils" aria-hidden="true" focusable="false"><g id="glowGroup"></g><g id="strandGroup"></g></svg>
    <div class="status" aria-live="polite"><span class="status-dot"></span><span id="statusText">Magnetic field · standby</span></div>
    <span class="signature">VMB—001 / NO EXTERNAL LIBRARIES</span>
  </main>
  <script>
    (() => {
      'use strict';
      const stage=document.getElementById('stage'),button=document.getElementById('venomButton'),buttonWrap=document.getElementById('buttonWrap'),label=document.getElementById('buttonLabel'),svg=document.getElementById('tendrils'),glowGroup=document.getElementById('glowGroup'),strandGroup=document.getElementById('strandGroup'),statusText=document.getElementById('statusText');
      const finePointer=window.matchMedia('(hover: hover) and (pointer: fine)'),reducedMotion=window.matchMedia('(prefers-reduced-motion: reduce)'),STRAND_COUNT=13,MAGNETIC_RADIUS=230,MAX_PULL=29;
      const clamp=(v,min,max)=>Math.max(min,Math.min(max,v)),lerp=(a,b,n)=>a+(b-a)*n;
      let width=window.innerWidth,height=window.innerHeight,pointer={x:width/2-300,y:height/2+100,seen:false},current={x:0,y:0,tilt:0,scale:1},active=false,caughtTimer=0;
      const pathPairs=[];
      function makePath(group,className,widthValue,index){const path=document.createElementNS('http://www.w3.org/2000/svg','path');path.setAttribute('class',className);path.setAttribute('stroke-width',widthValue);path.style.setProperty('--strand-opacity',(0.52+(index%4)*0.12).toFixed(2));path.style.setProperty('--glow-opacity',(0.08+(index%3)*0.06).toFixed(2));group.appendChild(path);return path;}
      for(let i=0;i<STRAND_COUNT;i++)pathPairs.push({glow:makePath(glowGroup,'tendril-glow',i%4===0?5.2:3.2,i),core:makePath(strandGroup,'tendril',i%5===0?2.15:(i%3===0?1.45:0.9),i),seed:i*1.71+.4,fan:(i-(STRAND_COUNT-1)/2)/((STRAND_COUNT-1)/2),length:.72+((i*7)%5)*.075});
      function resize(){width=window.innerWidth;height=window.innerHeight;svg.setAttribute('viewBox',`0 0 ${width} ${height}`);svg.setAttribute('width',width);svg.setAttribute('height',height);}
      function pathFor(sx,sy,ex,ey,fan,seed,time,strength,idx){const dx=ex-sx,dy=ey-sy,distance=Math.hypot(dx,dy)||1,nx=-dy/distance,ny=dx/distance,wave=Math.sin(time*.0021+seed)*(5+15*strength),wave2=Math.cos(time*.0017+seed*1.3)*(4+10*strength),fanOffset=fan*(7+strength*15),c1x=sx+dx*.23+nx*(fanOffset+wave)+Math.cos(seed+time*.001)*5,c1y=sy+dy*.23+ny*(fanOffset+wave)+Math.sin(seed+time*.001)*4,c2x=sx+dx*.70+nx*(fanOffset*1.5+wave2)+Math.sin(seed*1.7+time*.0014)*8,c2y=sy+dy*.70+ny*(fanOffset*1.5+wave2)+Math.cos(seed*1.4+time*.0014)*7,endJitter=1+(idx%3)*.7,endX=ex+nx*fan*endJitter,endY=ey+ny*fan*endJitter;return `M ${sx.toFixed(2)} ${sy.toFixed(2)} C ${c1x.toFixed(2)} ${c1y.toFixed(2)}, ${c2x.toFixed(2)} ${c2y.toFixed(2)}, ${endX.toFixed(2)} ${endY.toFixed(2)}`;}
      function updatePaths(now,strength,centerX,centerY,buttonW,buttonH){const near=pointer.seen&&strength>.015&&!reducedMotion.matches&&finePointer.matches;let targetX,targetY;if(near){targetX=pointer.x;targetY=pointer.y;}else{targetX=centerX-48+Math.sin(now*.0012)*8;targetY=centerY+buttonH*.5+76+Math.cos(now*.0018)*11;}const angle=Math.atan2(targetY-centerY,targetX-centerX),rx=buttonW*.48,ry=buttonH*.43,anchorX=centerX+Math.cos(angle)*rx,anchorY=centerY+Math.sin(angle)*ry,countStrength=near?strength:.22;pathPairs.forEach((pair,i)=>{const startOffset=pair.fan*(near?10+strength*13:15),sx=anchorX+Math.cos(angle+Math.PI/2)*startOffset,sy=anchorY+Math.sin(angle+Math.PI/2)*startOffset,pullX=near?targetX:targetX+pair.fan*15,pullY=near?targetY:targetY+pair.fan*10,endX=lerp(sx,pullX,pair.length),endY=lerp(sy,pullY,pair.length),path=pathFor(sx,sy,endX,endY,pair.fan,pair.seed,now,countStrength,i);pair.glow.setAttribute('d',path);pair.core.setAttribute('d',path);});if(near){stage.classList.add('is-active');if(!active)statusText.textContent='Magnetic field · engaged';active=true;}else{stage.classList.remove('is-active');if(active)statusText.textContent='Magnetic field · standby';active=false;}}
      function tick(now){const baseX=width/2,baseY=height/2,rect=button.getBoundingClientRect(),bw=rect.width||292,bh=rect.height||104,dist=pointer.seen?Math.hypot(pointer.x-baseX,pointer.y-baseY):Infinity,field=pointer.seen&&finePointer.matches&&!reducedMotion.matches?clamp(1-dist/MAGNETIC_RADIUS,0,1):0,force=field*field,dx=pointer.x-baseX,dy=pointer.y-baseY,targetX=clamp(dx*.27*force,-MAX_PULL,MAX_PULL),targetY=clamp(dy*.25*force,-MAX_PULL*.8,MAX_PULL*.8),targetTilt=clamp(dx*.018*force,-5,5),targetScale=1+force*.018,smoothing=reducedMotion.matches?1:.13;current.x=lerp(current.x,targetX,smoothing);current.y=lerp(current.y,targetY,smoothing);current.tilt=lerp(current.tilt,targetTilt,smoothing);current.scale=lerp(current.scale,targetScale,smoothing);button.style.setProperty('--tx',`${current.x.toFixed(2)}px`);button.style.setProperty('--ty',`${current.y.toFixed(2)}px`);button.style.setProperty('--tilt',`${current.tilt.toFixed(2)}deg`);button.style.setProperty('--scale',current.scale.toFixed(3));updatePaths(now,field,baseX+current.x,baseY+current.y,bw,bh);requestAnimationFrame(tick);}
      stage.addEventListener('pointermove',event=>{if(event.pointerType==='touch')return;const bounds=stage.getBoundingClientRect();pointer.x=event.clientX-bounds.left;pointer.y=event.clientY-bounds.top;pointer.seen=true;},{passive:true});
      stage.addEventListener('pointerleave',()=>{pointer.seen=false;});
      button.addEventListener('click',()=>{button.classList.add('is-caught');label.textContent='gotcha.';statusText.textContent='Capture successful';window.clearTimeout(caughtTimer);caughtTimer=window.setTimeout(()=>{button.classList.remove('is-caught');label.textContent='let’s collaborate';statusText.textContent=active?'Magnetic field · engaged':'Magnetic field · standby';},1050);});
      window.addEventListener('resize',resize,{passive:true});resize();requestAnimationFrame(tick);
    })();
  </script>
</body>
</html>
